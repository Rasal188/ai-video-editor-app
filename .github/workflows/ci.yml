name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Automated Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard repository size & forbidden assets
        shell: bash
        timeout-minutes: 2
        run: |
          if [[ -n "$(git ls-files 'public/models/**')" ]]; then
            echo "::error::AI model weights must be hosted externally, not committed under public/models/."
            git ls-files 'public/models/**'
            exit 1
          fi

          max_bytes=$((20 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(stat --format=%s "$file")
            if (( size > max_bytes )); then
              echo "::error file=$file::Tracked file exceeds the 20 MiB repository limit."
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify media tooling (FFmpeg)
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
          else
            echo "Pre-installed FFmpeg detected on runner:"
            ffmpeg -version | head -n 1
          fi

      - name: Install dependencies
        timeout-minutes: 5
        env:
          # GitHub-hosted runners are CPU-only. onnxruntime-node otherwise
          # assumes CUDA 12 on Linux x64 and downloads an unavailable archive.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Code quality lint
        timeout-minutes: 4
        run: npm run lint

      - name: TypeScript typecheck
        timeout-minutes: 3
        run: npm run typecheck

      - name: Production bundle build
        timeout-minutes: 5
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Run backend automated tests
        timeout-minutes: 4
        run: npm run test:backend
