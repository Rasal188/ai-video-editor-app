name: Deploy to Production VM

'on':
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (must be 40-character lowercase hex on main)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-vm-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Release to Production VM
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 15
    if: >-
      github.repository == 'Rasal188/ai-video-editor-app' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_repository.full_name == 'Rasal188/ai-video-editor-app' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )

    steps:
      - name: Validate & Determine Commit SHA
        id: resolve-sha
        env:
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_INPUT_SHA: ${{ inputs.commit_sha }}
          DEFAULT_TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          TARGET_SHA="${EVENT_HEAD_SHA:-${MANUAL_INPUT_SHA:-$DEFAULT_TRIGGER_SHA}}"
          echo "Target commit SHA resolved to: $TARGET_SHA"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target SHA '$TARGET_SHA' is not a valid 40-character lowercase hex hash."
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify Exact Target SHA CI Provenance & Trust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        shell: bash
        run: |
          node - << 'EOF'
          const targetSha = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          const repo = 'Rasal188/ai-video-editor-app';
          const expectedPath = '.github/workflows/ci.yml';
          const expectedWorkflowName = 'CI';

          if (!targetSha || !/^[0-9a-f]{40}$/.test(targetSha)) {
            console.error(`::error::Target SHA '${targetSha}' is invalid or missing in CI verification step.`);
            process.exit(1);
          }

          if (!token) {
            console.error('::error::GITHUB_TOKEN is missing in environment. Cannot establish CI provenance.');
            process.exit(1);
          }

          console.log(`Verifying CI provenance for commit ${targetSha} in ${repo}...`);

          let page = 1;
          const maxPages = 10;
          const matchingRuns = [];

          async function verify() {
            while (page <= maxPages) {
              const url = `https://api.github.com/repos/${repo}/actions/runs?head_sha=${targetSha}&per_page=100&page=${page}`;
              let res;
              try {
                res = await fetch(url, {
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                });
              } catch (err) {
                console.error(`::error::Network error while querying GitHub Actions API on page ${page}: ${err.message}`);
                process.exit(1);
              }

              if (!res.ok) {
                console.error(`::error::GitHub API returned HTTP ${res.status} while querying runs on page ${page}. Failing closed.`);
                process.exit(1);
              }

              let data;
              try {
                data = await res.json();
              } catch (err) {
                console.error(`::error::Failed to parse GitHub API JSON response on page ${page}: ${err.message}`);
                process.exit(1);
              }

              const runs = data.workflow_runs;
              if (!Array.isArray(runs)) {
                console.error('::error::Unexpected GitHub Actions API payload: workflow_runs is not an array.');
                process.exit(1);
              }

              for (const run of runs) {
                if (
                  run.head_sha === targetSha &&
                  run.head_branch === 'main' &&
                  run.head_repository?.full_name === repo &&
                  run.repository?.full_name === repo &&
                  run.path === expectedPath &&
                  run.name === expectedWorkflowName
                ) {
                  matchingRuns.push(run);
                }
              }

              const linkHeader = res.headers.get('link') || '';
              const hasNextPage = linkHeader.includes('rel="next"') || (runs.length === 100 && (data.total_count || 0) > page * 100);

              if (hasNextPage) {
                page += 1;
              } else {
                break;
              }
            }

            if (matchingRuns.length === 0) {
              console.error(`::error::Validation failed: Target commit ${targetSha} has no completed CI runs on 'main' from trusted repository '${repo}'. Failing closed.`);
              process.exit(1);
            }

            // Disallow any in-progress runs
            const activeRun = matchingRuns.find(r => r.status !== 'completed');
            if (activeRun) {
              console.error(`::error::CI run #${activeRun.id} is currently ${activeRun.status}. Deployment cannot proceed until CI completes.`);
              process.exit(1);
            }

            // Sort runs descending by ID (most recent run first)
            matchingRuns.sort((a, b) => (b.id || 0) - (a.id || 0));
            const latestRun = matchingRuns[0];

            if (latestRun.status === 'completed' && latestRun.conclusion === 'success') {
              console.log(`SUCCESS: Target commit ${targetSha} verified via completed CI run #${latestRun.id} (conclusion: success, workflow: ${latestRun.name}, path: ${latestRun.path}).`);
              process.exit(0);
            }

            console.error(`::error::Validation failed: Latest CI run #${latestRun.id} for commit ${targetSha} concluded with '${latestRun.conclusion}' (expected 'success'). Failing closed.`);
            process.exit(1);
          }

          verify().catch(err => {
            console.error(`::error::Unexpected exception during CI verification: ${err.message}`);
            process.exit(1);
          });
          EOF

      - name: Execute Privileged Release Wrapper
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        shell: bash
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target SHA is invalid or missing in execution step."
            exit 1
          fi
          echo "Invoking deployment wrapper for commit: $TARGET_SHA"
          sudo -u rasal /home/rasal/bin/deploy-release.sh "$TARGET_SHA"
